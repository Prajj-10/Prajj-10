<svg xmlns="http://www.w3.org/2000/svg" width="380" height="150" viewBox="0 0 380 150" role="img" aria-label="Prajjwal Veer Basnet — Building on ideas that I find interesting.">
<style>
    svg {
      --bg: #ffffff; --border: #d0d7de; --text: #1f2328;
      --muted: #59636e; --dim: #818b98; --accent: #0969da;
      --wave: #ccd4dc; --waveLit: #0969da; --tick: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --border: #30363d; --text: #e6edf3;
        --muted: #8b949e; --dim: #6e7681; --accent: #58a6ff;
        --wave: #30363d; --waveLit: #58a6ff; --tick: #3fb950;
      }
    }
    .c-bg { fill: var(--bg); }
    .c-border { fill: none; stroke: var(--border); }
    .c-text { fill: var(--text); }
    .c-muted { fill: var(--muted); }
    .c-dim { fill: var(--dim); }
    .c-accent { fill: var(--accent); }
    .c-wave { fill: var(--wave); }
    .c-waveLit { fill: var(--waveLit); }
    .c-tick { fill: var(--tick); }
    .c-waveLitStop { stop-color: var(--waveLit); }
    .bar { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tick { animation: pass 7.0s linear infinite; }
    .head { animation: sweep 7.0s linear infinite; }
    .glow { animation: sweep 7.0s linear infinite; }
    .cur  { animation: blink 1.1s steps(1) infinite; }
    @keyframes breathe { 0%,100% { transform: scaleY(0.82); } 50% { transform: scaleY(1.06); } }
    @keyframes sweep   { from { transform: translateX(0px); } to { transform: translateX(344px); } }
    @keyframes pass    { 0%,100% { opacity: .28; } 48% { opacity: .28; } 50% { opacity: 1; } 62% { opacity: .28; } }
    @keyframes blink   { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .tick, .head, .glow, .cur { animation: none; }
    }
    </style>
