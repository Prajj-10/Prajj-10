<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img" aria-label="Prajjwal Veer Basnet — I love building on ideas that I find interesting.">
<style>
    .bar { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tick { animation: pass 7.0s linear infinite; }
    .head { animation: sweep 7.0s linear infinite; }
    .glow { animation: sweep 7.0s linear infinite; }
    .cur  { animation: blink 1.1s steps(1) infinite; }
    @keyframes breathe { 0%,100% { transform: scaleY(0.82); } 50% { transform: scaleY(1.06); } }
    @keyframes sweep   { from { transform: translateX(0px); } to { transform: translateX(1112px); } }
    @keyframes pass    { 0%,100% { opacity: .28; } 48% { opacity: .28; } 50% { opacity: 1; } 62% { opacity: .28; } }
    @keyframes blink   { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .tick, .head, .glow, .cur { animation: none; }
    }
    </style>
