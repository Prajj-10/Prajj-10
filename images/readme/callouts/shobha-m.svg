<svg xmlns="http://www.w3.org/2000/svg" width="380" height="110" viewBox="0 0 380 110" role="img" aria-label="Check out how FIFO works → Examples of two shelves of the same week and the same orders. The only difference is how they are dispatched and which one ends up as waste.">
<title>Check out how FIFO works →</title>
<style>
        svg { --bg: #eef7f0; --bar: #1a7f37; --cta: #1a7f37;
               --body: #3d3d3d; --border: #b6e2c4; }
        @media (prefers-color-scheme: dark) {
          svg { --bg: #0d1a12; --bar: #3fb950; --cta: #3fb950;
                 --body: #c9d1d9; --border: #204a30; }
        }
        .c-bg { fill: var(--bg); stroke: var(--border); }
        .c-bar { fill: var(--bar); }
        .c-cta { fill: var(--cta); }
        .c-body { fill: var(--body); }
        </style>
<rect x="0.5" y="0.5" width="379" height="108" rx="8" class="c-bg"/>
<rect x="0" y="0" width="3" height="110" class="c-bar"/>
<text x="28" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" class="c-cta">Check out how FIFO works →</text>
<text x="28" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" class="c-body">Examples of two shelves of the same week and the</text>
<text x="28" y="71.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" class="c-body">same orders. The only difference is how they are</text>
<text x="28" y="90.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" class="c-body">dispatched and which one ends up as waste.</text>
</svg>