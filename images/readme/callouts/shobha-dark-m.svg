<svg xmlns="http://www.w3.org/2000/svg" width="380" height="119" viewBox="0 0 380 119" role="img" aria-label="Check out how FIFO works → Examples of two shelves of the same week and the same orders. The only difference is how they are dispatched and which one ends up as waste.">
<title>Check out how FIFO works →</title>
<rect x="0.5" y="0.5" width="379" height="118" rx="8" fill="#0d1a12" stroke="#204a30"/>
<rect x="0" y="0" width="3" height="119" fill="#3fb950"/>
<text x="28" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3fb950">Check out how FIFO works →</text>
<text x="28" y="50.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">Examples of two shelves of the same week and</text>
<text x="28" y="67.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">the same orders. The only difference is how</text>
<text x="28" y="84.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">they are dispatched and which one ends up as</text>
<text x="28" y="101.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">waste.</text>
</svg>